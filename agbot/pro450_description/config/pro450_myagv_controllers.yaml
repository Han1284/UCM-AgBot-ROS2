controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_trajectory_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true

gripper_trajectory_controller:
  ros__parameters:
    joints: [gripper_controller]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true

joint_state_broadcaster:
  ros__parameters:
    # Base motion is owned by Gazebo's planar velocity plugin, not ros2_control.
    # Publish neutral wheel states so MoveIt's complete-state monitor does not
    # treat the stopped mobile platform as an incomplete robot state.
    extra_joints:
      [left_front_wheel_joint, left_rear_wheel_joint,
       right_front_wheel_joint, right_rear_wheel_joint]
